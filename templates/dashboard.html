<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IDS Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --border: #212b38;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3fb950;
    --high: #f85149;
    --medium: #d29922;
    --low: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .stat-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat-box {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-box .num { font-size: 28px; font-weight: 700; }
  .stat-box .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .sev {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .sev-high { background: rgba(248,81,73,0.15); color: var(--high); }
  .sev-medium { background: rgba(210,153,34,0.15); color: var(--medium); }
  .sev-low { background: rgba(63,185,80,0.15); color: var(--low); }
  .event-list { max-height: 420px; overflow-y: auto; }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { border-color: var(--accent); }
  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
  }
</style>
</head>
<body>

<h1><span class="pulse"></span>Intrusion Detection System</h1>
<div class="subtitle">Live network monitoring &middot; port scans, brute force, sensitive port access</div>

<div class="stat-row">
  <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label">Total Events</div></div>
  <div class="stat-box"><div class="num" id="stat-high">0</div><div class="label">High Severity</div></div>
  <div class="stat-box"><div class="num" id="stat-scans">0</div><div class="label">Port Scans</div></div>
  <div class="stat-box"><div class="num" id="stat-brute">0</div><div class="label">Brute Force Attempts</div></div>
</div>

<div class="grid">
  <div class="panel">
    <h2>Events Over Time</h2>
    <canvas id="timelineChart" height="80"></canvas>
  </div>
  <div class="panel">
    <h2>Events by Type</h2>
    <canvas id="typeChart" height="180"></canvas>
  </div>
</div>

<div class="panel">
  <h2 style="display:flex; justify-content:space-between; align-items:center;">
    Live Alert Feed
    <button onclick="clearEvents()">Clear</button>
  </h2>
  <div class="event-list">
    <table>
      <thead>
        <tr><th>Time</th><th>Type</th><th>Source</th><th>Target</th><th>Severity</th><th>Detail</th></tr>
      </thead>
      <tbody id="event-body"></tbody>
    </table>
  </div>
</div>

<script>
let timelineChart, typeChart;

function initCharts() {
  const timelineCtx = document.getElementById('timelineChart').getContext('2d');
  timelineChart = new Chart(timelineCtx, {
    type: 'line',
    data: { labels: [], datasets: [{
      label: 'Events',
      data: [],
      borderColor: '#3fb950',
      backgroundColor: 'rgba(63,185,80,0.1)',
      fill: true,
      tension: 0.3,
    }]},
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b98a5' }, grid: { color: '#212b38' } },
        y: { ticks: { color: '#8b98a5' }, grid: { color: '#212b38' }, beginAtZero: true }
      }
    }
  });

  const typeCtx = document.getElementById('typeChart').getContext('2d');
  typeChart = new Chart(typeCtx, {
    type: 'doughnut',
    data: { labels: [], datasets: [{
      data: [],
      backgroundColor: ['#f85149', '#d29922', '#3fb950', '#58a6ff'],
      borderColor: '#121821',
      borderWidth: 2,
    }]},
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { color: '#e6edf3', font: { size: 11 } } } }
    }
  });
}

function severityClass(sev) {
  return sev === 'high' ? 'sev-high' : sev === 'medium' ? 'sev-medium' : 'sev-low';
}

async function refresh() {
  const [eventsRes, statsRes] = await Promise.all([
    fetch('/api/events'), fetch('/api/stats')
  ]);
  const events = await eventsRes.json();
  const stats = await statsRes.json();

  // stat boxes
  document.getElementById('stat-total').textContent = events.length;
  document.getElementById('stat-high').textContent = events.filter(e => e.severity === 'high').length;
  document.getElementById('stat-scans').textContent = events.filter(e => e.event_type === 'port_scan').length;
  document.getElementById('stat-brute').textContent = events.filter(e => e.event_type === 'brute_force').length;

  // event table
  const tbody = document.getElementById('event-body');
  tbody.innerHTML = events.map(e => `
    <tr>
      <td>${e.timestamp.split('T')[1] || e.timestamp}</td>
      <td>${e.event_type.replace('_', ' ')}</td>
      <td>${e.source_ip || '-'}</td>
      <td>${e.target_ip || '-'}${e.target_port ? ':' + e.target_port : ''}</td>
      <td><span class="sev ${severityClass(e.severity)}">${e.severity}</span></td>
      <td style="color:#8b98a5; font-size:12px;">${e.description}</td>
    </tr>
  `).join('');

  // type chart
  const typeLabels = Object.keys(stats.counts_by_type);
  const typeCounts = Object.values(stats.counts_by_type);
  typeChart.data.labels = typeLabels;
  typeChart.data.datasets[0].data = typeCounts;
  typeChart.update();

  // timeline chart
  const timelineLabels = stats.timeline.map(t => t[0]);
  const timelineCounts = stats.timeline.map(t => t[1]);
  timelineChart.data.labels = timelineLabels;
  timelineChart.data.datasets[0].data = timelineCounts;
  timelineChart.update();
}

async function clearEvents() {
  await fetch('/api/clear', { method: 'POST' });
  refresh();
}

initCharts();
refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
